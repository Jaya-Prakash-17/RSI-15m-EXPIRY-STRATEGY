# =============================================================================
# NIFTY Futures RSI-60 Breakout Strategy -- Configuration
# Long-only NIFTY Spot signal, Futures execution
# =============================================================================

backtest:
  start_date: "2020-01-01"
  end_date: "2025-12-31"
  offline_mode: false

capital:
  initial: 500000           # Starting capital (margin for 1 lot NIFTY Futures)


# ============================================================
# NIFTY FUTURES CHARGES — NSE/SEBI APRIL 2026
# Conservative/Pessimistic config for robust backtesting
# ============================================================
charges:
  # STT: Budget 2026 hiked futures STT from 0.02% → 0.05% on SELL side
  # Effective April 1, 2026 (Zerodha circular confirmed)
  # Using 0.05% = 0.0005 as decimal
  stt: 0.0005                   # 0.05% on sell-side turnover (POST Apr 2026)

  # NSE Exchange Txn: Rs.182.99 per crore = Rs.1.83 per lakh = 0.00183%
  # Use Rs.1.90 per lakh (slightly pessimistic, broker pass-through markup)
  exchange_txn_fee: 0.0000190   # 0.0019% (conservative, includes IPFT)

  # Brokerage: Rs.20/order flat (Groww/Zerodha/Dhan)
  # Rs.40 per round-trip (entry + exit) = coded as per-order
  brokerage_per_trade: 20       # Per leg; engine should apply × 2 per round-trip

  # GST: 18% on (brokerage + exchange txn fee) only — NOT on STT/stamp
  gst: 0.18

  # SEBI: Rs.10 per crore of turnover (both sides)
  sebi_charges: 0.000001        # 1e-6 of turnover ✅ unchanged

  # Stamp duty: Rs.200 per crore on BUY side only
  stamp_duty: 0.00002           # 0.002% on buy-side ✅ unchanged

  # Slippage: 2 ticks per side (pessimistic) for futures
  # 1 tick = Rs.0.05 × qty; at 2 lots: 2 × 0.05 × qty × 2 sides
  slippage_ticks_per_side: 2    # Pessimistic: use 2 (normal days = 1)

data:
  download_retry_count: 3
  storage_path: data         # Reuses existing spot data directory

# NIFTY futures use the same tick size; lot sizes are resolved historically
indices:
  NIFTY:
    tick_size: 0.05
    lot_size: 65             # Current lot size (historical lookup overrides this)

reporting:
  slippage_buffer_enabled: true
  slippage_model: position_scaled
  slippage_ticks_per_side: 1
  slippage_min_per_trade: 30
  slippage_max_per_trade: 300

risk:
  max_loss_per_day: 6500     # Daily loss limit in INR
  max_consecutive_losses: 5
  consecutive_loss_cooldown: 0

strategy:
  # RSI Configuration
  rsi:
    period: 11
    threshold: 60            # RSI crossover level
    warmup_periods: 110      # 10x period for stable RSI
    min_candles_for_signal: 33  # period * 3

  # Signal Timing
  signal_window_start: "09:45"   # Start scanning after 9:45 AM
  signal_window_end: "14:45"     # Stop taking new entries

  # Entry Rules
  alert_validity_candles: 1      # Entry allowed only on NEXT candle after alert

  # Risk Management
  lots_per_trade: 2              # 2 lots of NIFTY Futures
  exit_mode: single_lot          # Single lot with trailing SL
  single_lot_exit_target: 3      # Exit at T3 (3x range)

  # SL Config
  min_sl_pct: 0.001              # 0.1% SL floor (minimal for index futures)
  safe_sl_mode: false
  safe_sl_max_loss: 5000

  # Other
  direction_filter_enabled: false
  rsi_debug: false
  max_position_pct: 1.0          # Allow full capital allocation

trading:
  window:
    start: "09:15"
    end: "15:30"
    auto_square_off: "15:15"
