backtest:
  end_date: '2025-12-31'
  start_date: '2025-01-01'
capital:
  initial: 200000
charges:
  brokerage_per_trade: 20
  exchange_txn_fee: 0.0009
  gst: 0.2
  sebi_charges: 0.0005
  stamp_duty: 5.0e-05
  stt: 0.002
data:
  download_retry_count: 3
  storage_path: data
indices:
  BANKNIFTY:
    expiry_day: Tuesday
    lot_size: 30
    tick_size: 0.05
  NIFTY:
    expiry_day: Tuesday
    lot_size: 65
    tick_size: 0.05
  SENSEX:
    expiry_day: Thursday
    lot_size: 20
    tick_size: 0.05
reporting:
  slippage_buffer_enabled: true
  slippage_buffer_per_trade: 50
risk:
  consecutive_loss_cooldown: 2
  max_consecutive_losses: 3
  max_loss_per_day: 6000
strategy:
  alert_validity: 1
  direction_filter_enabled: false
  dynamic_sizing_enabled: false
  exit_mode: single_lot
  lots_per_trade: 3
  max_correlated_positions: 2
  max_lots: 5
  max_position_pct: 0.8
  min_sl_pct: 0.10
  min_volume: 10000
  risk_per_trade_pct: 0.05
  rsi:
    min_candles_for_signal: 27
    period: 11
    threshold: 60
    warmup_periods: 100
  rsi_debug: false
  safe_sl_max_loss: 5000
  safe_sl_mode: true
  signal_window_end: '13:30'
  signal_window_start: '10:00'
  single_lot_exit_target: 3
  strike_range: 4
  trade_only_on_expiry: false
  trailing_stop:
    enabled: true
    move_by_alert_range: true
trading:
  order_poll_interval_seconds: 5
  paper_trading: true
  trade_log_file: logs/PAPER_TRADES_LOG.csv
  window:
    auto_square_off: '15:15'
    end: '13:45'
    start: '10:15'
