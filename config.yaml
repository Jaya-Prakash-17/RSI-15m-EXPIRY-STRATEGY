# =============================================================================
# RSI-15m Expiry Breakout Strategy - Configuration File
# =============================================================================

backtest:
  start_date: "2026-01-01"
  offline_mode: false
  end_date: "2026-06-03"

capital:
  initial: 200000         # Starting trading capital in INR (Example: 200000)

charges:
  brokerage_per_trade: 20 # Inflated 2X for stress test. Actual: 20 (as of April 2026)
  exchange_txn_fee: 0.0019 # Inflated 3X for stress test. Actual: 0.0006 (as of April 2026)
  gst: 0.20                # Inflated 3X for stress test. Actual: 0.20 (as of April 2026)
  sebi_charges: 9.0e-06    # Inflated 3X for stress test. Actual: 0.000003 (as of April 2026)
  stamp_duty: 0.00018      # Inflated 3X for stress test. Actual: 0.00006 (as of April 2026)
  stt: 0.0015              # Inflated 2X for stress test. Actual: 0.0015 (as of April 2026)

data:
  download_retry_count: 3  # Times to retry failed data downloads (Example: 3)
  storage_path: data       # Directory where CSV data is stored (Example: data)

indices:
  # BANKNIFTY:
  #   expiry_day: Tuesday
  #   lot_size: 30
  #   tick_size: 0.05
  # NIFTY:
  #   expiry_day: Tuesday
  #   lot_size: 65
  #   tick_size: 0.05
  SENSEX:
    expiry_day: Thursday
    lot_size: 20
    tick_size: 0.05

reporting:
  slippage_buffer_enabled: true     # Add random noise to trade execution prices (Example: true)
  slippage_buffer_per_trade: 65     # Fixed slippage buffer in INR (Example: 65)
  slippage_max_per_trade: 500       # Maximum allowed slippage in INR (Example: 500)
  slippage_min_per_trade: 50        # Minimum allowed slippage in INR (Example: 50)
  slippage_model: position_scaled   # Choose how slippage is calculated (Example: position_scaled)
  slippage_ticks_per_side: 1        # Extra price points to add for slippage (Example: 1)

risk:
  max_consecutive_losses: 9     # Circuit breaker: halt after N consecutive losses
  consecutive_loss_cooldown: 0  # 0 = no new trades for rest of session
  max_loss_per_day: 5000       # Reverted for testing: Rs.6000
  slippage_abort_min_points: 5 # ₹2 absolute gap threshold for OTM options
  # For paper/backtest stress-test: can use 6000
  max_slippage_pct: 0.05       # [SLIP-01] Max allowed slippage (2%) before entry block or exit alert

resilience:
  disconnect_emergency_threshold_mins: 10 # [SAFE-02] Mins of disconnect before emergency flatten
  reconnect_resync_gap_mins: 15           # [RECO-01] Gap size forcing full cache rebuild


# ─── SAFE SL / POSITION SIZING FORMULA (BUG-07) ──────────────────────
# max_sl_distance = safe_sl_max_loss / (lots_per_trade × lot_size)
# Example (1-lot NIFTY):  2000 / (1 × 65) = Rs.30.77/unit
# Example (3-lot NIFTY):  6000 / (3 × 65) = Rs.30.77/unit  (same distance, 3× risk)
# Rule: Always verify max_sl_distance > typical ATM premium × min_sl_pct
# ──────────────────────────────────────────────────────────────────────
strategy:
  allowed_opt_types: ["CE", "PE"] # Options to look for: ["CE", "PE"], ["CE"], or ["PE"]
  alert_validity_candles: 1        # [BUG-04] Entry allowed only on T+1 (15 min after alert)
  direction_filter_enabled: false   # Enabled to filter out counter-trend trades and reduce drawdown
  exit_mode: single_lot         # Multi-lot scaling reduces drawdown significantly
  lots_per_trade: 3          # Reverted to 3 to match profitable history
  max_correlated_positions: 2    # Max positions allowed across different indices (Example: 2)
  max_lots: 5                   # Hard cap on total lots allowed per index (Example: 5)
  max_position_pct: 0.8         # Max capital usage per single trade (Example: 0.8)
  min_alert_range_points: 0.5   # Minimum candle range to consider for signal (Example: 0.5)
  min_sl_pct: 0.1              # 10% SL floor (Reverted to 0.1)

  rsi:
    min_candles_for_signal: 33   # period*3 = 11*3
    period: 9                   # matches production live bot
    threshold: 60            # RSI 60 to ensure higher momentum and fewer false signals
    warmup_periods: 110          # 10x period = 110 for period=11 (was 100 for period=10x)
  rsi_debug: false               # Print detailed RSI calculations to logs (Example: false)
  safe_sl_max_loss: 10000        # 3-lot NIFTY: 10000/(3x65)=Rs.51.28/unit max SL distance
  safe_sl_mode: false             # Use tighter SL based on max loss param — statistically validated
  signal_window_start: '10:00'  # Time to start looking for signals (Example: '09:45')
  signal_window_end: '13:45'    # Time to stop taking new trades (Example: '14:30')
  single_lot_exit_target: 2    # Reverted to T3 (3x range) to capture larger moves
  strike_range: 2               # Number of strikes away from ATM to trade (Example: 3)
  trade_only_on_expiry: false   # If true, only trades on expiry day (Example: false)

trading:
  order_poll_interval_seconds: 5 # How often to check for order completion (Example: 5)
  paper_trading: true            # Use simulated execution vs real orders (Example: true)
  sqoff_fill_wait_seconds: 8     # Total time to wait for SQ_OFF exit order to fill (Example: 8)
  api_calls_per_second: 5.0      # [BUG-RATELIMIT-INIT-01] Shared rate limiter budget (default: 5.0)
  trade_log_file: logs/PAPER_TRADES_LOG.csv # File path for recording trades (Example: logs/LIVE_LOG.csv)
  window:
    start: '09:45'           # Broker connection start time (Example: '09:15')
    end: '15:30'             # Monitoring window end time (Example: '15:15')
    auto_square_off: '15:15' # Time to exit all remaining positions (Example: '15:20')
