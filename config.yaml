backtest:
  start_date: '2026-01-01'
  end_date: '2026-03-24'
capital:
  initial: 100000
data:
  download_retry_count: 3
  storage_path: data
indices:
  BANKNIFTY:
    expiry_day: Tuesday  # Monthly last Tuesday (from Sep 2025)
    lot_size: 30
    tick_size: 0.05
  NIFTY:
    expiry_day: Tuesday  # Current expiry day (code handles historical Thursday → Tuesday change)
    lot_size: 65
    tick_size: 0.05
  # SENSEX:
  #   expiry_day: Thursday
  #   lot_size: 20
  #   tick_size: 0.05
risk:
  max_loss_per_day: 5000
strategy:
  alert_validity: 1  # Candles allowed for price to break alert_high (after alert candle)
  exit_mode: single_lot #single_lot or multi_lot
  lots_per_trade: 3
  max_lots: 5                     # P-21: hard ceiling regardless of sizing mode
  max_position_pct: 0.25          # P-21: never risk > 25% of capital per trade
  max_correlated_positions: 1     # P-09: max same-direction trades across indices (1=no NIFTY CE + BANKNIFTY CE)
  dynamic_sizing_enabled: false   # P-24: enable after 20+ validated sessions
  risk_per_trade_pct: 0.015       # P-24: 1.5% of capital per trade when dynamic enabled
  single_lot_exit_target: 3  # 1=T1, 2=T2, 3=T3 — used in single_lot exit mode
  rsi:
    period: 11 # RSI(14) — standard Wilder RSI, matches strategy design
    threshold: 60
    warmup_periods: 9 # CANDLE COUNT (not multiplied by rsi_period). 100x15min = ~3 trading days
    min_candles_for_signal: 27   # rsi_period × 3 — minimum before any alert fires
  trade_only_on_expiry: false  # false:trade on every day, true:trade only on expiry day
  rsi_debug: false   # set true only when validating RSI values against Groww chart
  safe_sl_mode: true # If true, caps SL distance to max loss limit below
  safe_sl_max_loss: 5000 # Max ₹ loss per trade position (total across all lots)
  min_sl_pct: 0.08   # 8% of trigger price floor for stop loss
  signal_window_start: '10:00' # No new alerts before this time
  signal_window_end: '13:30'   # No new alerts after this time
  direction_filter_enabled: false # CE only on bullish spot, PE only on bearish spot
  trailing_stop:
    enabled: true
    move_by_alert_range: true
trading:
  paper_trading: true  # Set to false for REAL trading with actual money
  trade_log_file: "logs/PAPER_TRADES_LOG.csv"  # Separate file for trade audit trail
  order_poll_interval_seconds: 5  # How often to poll order status (seconds). Default 5 = ~21,600 calls/day vs 108,000 at 1s.
  window:
    auto_square_off: '15:15'
    end: '13:45'
    start: '10:15'
charges:
  brokerage_per_trade: 20 # Flat ₹20 per trade (each leg)
  stt: 0.002            # 0.05% on sell side for options
  exchange_txn_fee: 0.00053 # 0.053% NSE charges (approx)
  gst: 0.2             # 18% on brokerage + txn fees
  sebi_charges: 0.0002   # 0.0001% (approx ₹10 per Cr)
  stamp_duty: 0.00005    # 0.003% on buy side (Options)
reporting:                 # P-28: slippage buffer configuration
  slippage_buffer_per_trade: 0    # ₹ flat deduction per trade (200-500 typical for NIFTY options)
  slippage_buffer_enabled: false  # Set true to apply realistic execution cost estimate
