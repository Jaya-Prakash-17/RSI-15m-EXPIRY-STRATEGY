# config.yaml — RSI Expiry Trading Bot Configuration

# Backtest Settings
backtest:
  start_date: '2020-01-01'           # Backtest start (YYYY-MM-DD)
  end_date: '2025-12-31'             # Backtest end (YYYY-MM-DD)

# Capital Configuration
capital:
  initial: 200000                    # Initial trading capital per session (Rs.)

# Trading Charges & Taxes (Live Values as of Jan 2026)
charges:
  brokerage_per_trade: 20            # Rs.20 flat (standard discount broker)
  exchange_txn_fee: 0.0006       # NSE: 0.03503% on premium (True-to-Label Oct 2024 update)
  gst: 0.20                          # 18% GST on (Brokerage + Txn Fee + SEBI)
  sebi_charges: 0.000003             # SEBI Turnover Fee: 0.0001% (Rs.10 per Crore)
  stamp_duty: 0.00006               # 0.003% on Buy Premium
  stt: 0.001                         # 0.1% on Sell Premium (STT updated Oct 2024)

# Data Management
data:
  download_retry_count: 3            # Max retries for API data failure
  storage_path: data                 # Local directory for CSV data storage

# Index Specific Parameters (Updated Jan 2026)
indices:
  BANKNIFTY:
    expiry_day: Tuesday
    lot_size: 30
    tick_size: 0.05
  NIFTY:
    expiry_day: Tuesday
    lot_size: 65
    tick_size: 0.05
  SENSEX:
    expiry_day: Thursday
    lot_size: 20
    tick_size: 0.05

# Performance Reporting
reporting:
  slippage_buffer_enabled: true      # If true, subtracts flat buffer from each trade P&L
  slippage_buffer_per_trade: 50      # Flat slippage buffer in Rs. (P-28)

# Risk Management
risk:
  consecutive_loss_cooldown: 2       # [DEPRECATED] Placeholder for future use
  max_consecutive_losses: 3          # Circuit breaker: stop after N losses (V11-P-02)
  max_loss_per_day: 6000             # Stop bot if Realized + Unrealized P&L <= this (Rs.)

# Strategy Parameters
strategy:
  alert_validity: 1                  # Alert candle + 1 candle window for entry
  direction_filter_enabled: false    # If true, filters CE on bearish / PE on bullish spot
  dynamic_sizing_enabled: false      # Placeholder for future capital scaling
  exit_mode: single_lot              # 'single_lot' or 'multi_lot'
  lots_per_trade: 3                  # Number of lots per position
  max_correlated_positions: 2        # Max concurrent trades in same direction (P-09)
  max_lots: 5                        # Global lot limit (hard cap)
  max_position_pct: 0.8              # Max % of capital to use per trade
  min_sl_pct: 0.10                   # Minimum SL % distance (P-27)
  risk_per_trade_pct: 0.05           # Target risk % per trade relative to initial capital
  rsi:
    min_candles_for_signal: 27       # Min candles required to validate RSI signal (V14-P-01)
    period: 11                       # RSI Lookback period
    threshold: 60                    # Breakout threshold (60 for CE calls, 40 for PE puts)
    warmup_periods: 100              # Min history required before scanning (V16 prerequisite)
  rsi_debug: false                   # Verbose RSI value logging
  safe_sl_max_loss: 5000             # Absolute loss cap per trade (Rs.) (P-23)
  safe_sl_mode: true                 # Enforce safe_sl_max_loss guard
  signal_window_start: '10:00'       # Start scanner window (P-30)
  signal_window_end: '13:30'         # End scanner window (P-30)
  single_lot_exit_target: 3         # Target index for exit (1=T1, 2=T2, 3=T3)
  strike_range: 4                    # Number of strikes to scan around ATM
  trade_only_on_expiry: false        # If true, scans only indices expiring TODAY

# Live/Paper Trading Environment
trading:
  order_poll_interval_seconds: 5     # Wait between broker order status polls (Groww API safety)
  paper_trading: true                # Simulation mode (V15-P-01 hardened)
  trade_log_file: logs/PAPER_TRADES_LOG.csv
  window:
    start: '10:15'                   # Trading window start (IST)
    end: '13:45'                     # Trading window end (IST)
    auto_square_off: '15:15'         # Force close all positions at this time (IST)
